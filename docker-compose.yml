services:
  apaar-registry:
    build: .
    ports: ["8000:8000"]
    environment:
      # Set to a LAN address (e.g. http://192.168.1.20:8000) to scan credential QRs from a phone.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DEMO_MODE: "1"
      # DATABASE_URL: postgresql+psycopg://user:pass@db/apaar   (install the `postgres` extra)
    volumes: ["registry-data:/app/data"]
volumes:
  registry-data:
