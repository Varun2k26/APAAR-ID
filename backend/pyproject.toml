[project]
name = "apaar-registry"
version = "0.1.0"
description = "APAAR Registry: a student-level national enrolment register for AICTE (prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "python-multipart>=0.0.17",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.10",
    "jellyfish>=1.1",
    "cryptography>=43",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "bcrypt>=4.2",
    "qrcode[pil]>=8.0",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
